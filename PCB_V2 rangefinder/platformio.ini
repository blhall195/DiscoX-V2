; DiscoX rangefinder-only firmware (PCB V2, single nRF52840)
;
; A stripped-down sibling of ../PCB_V2: laser distance + a small menu
; (shutdown timeout, laser timeout, firmware update, power off). No compass,
; calibration, BLE, history, disco or USB drive mode. See CLAUDE.md here.
;
; Same board, bootloader, linker script and flash map as ../PCB_V2, so the
; two firmwares can be swapped freely by UF2 without touching each other's
; stored data (settings, calibration, reading history, FAT partition).
;
;   pio run -t upload       # USB DFU — send 'u' over serial first (see CLAUDE.md)

[platformio]
default_envs = pcb_v2_rangefinder

[env:pcb_v2_rangefinder]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
; Same app cap as ../PCB_V2 (0x26000-0xC5000): keeps the image clear of the
; reading history ring, FAT partition and LittleFS that the full firmware
; owns. Keep in step with ../PCB_V2 if its flash map ever changes.
board_build.ldscript = linker/nrf52840_s140_v6_usbfat.ld
board_upload.maximum_size = 651264
; Post-build: emit firmware.uf2 for drag-and-drop updates
extra_scripts = post:tools/make_uf2.py
build_flags =
    -Os
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    adafruit/Adafruit SH110X@^2.1.12
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit MAX1704X@^1.0.3
    adafruit/Adafruit BusIO@^1.16.2
