; Mr Zappy PCB V2 — IC bring-up tests (one env per IC, shared drivers)
;
; Board: nrf52840_dk_adafruit uses the pca10056 variant, whose Arduino pin
; numbers map 1:1 to nRF GPIO (P0.xx = xx, P1.yy = 32+yy) — exactly what we
; want for a custom PCB. All board pins live in include/pins_v2.h.
; Do NOT use an ItsyBitsy-based board/variant here: its pin map does not
; match the V2 netlist (its I2C pins collide with the SCA3300 SPI pins).
;
; Flashing (Adafruit UF2/DFU bootloader is already burned on the module):
;   pio run -e <env> -t upload     # USB DFU, port auto-detected
; The 1200bps touch below resets a running app into the bootloader, so
; re-flashing works without touching the board. For a factory-fresh module,
; burn the Adafruit nRF52840 bootloader once via SWD header H2 (J-Link):
; that also provides SoftDevice S140, which this core links against.

[env]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
; DK profile doesn't 1200bps-touch (real DK uses J-Link) — needed so a running
; app resets into the bootloader for USB re-flash
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

[env:sca3300_test]
build_src_filter = +<drivers/> +<tests/test_sca3300.cpp>

[env:rm3100_test]
build_src_filter = +<drivers/> +<tests/test_rm3100.cpp>

[env:ldj100_test]
build_src_filter = +<drivers/> +<tests/test_ldj100.cpp>

[env:ws2812_test]
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
build_src_filter = +<drivers/> +<tests/test_ws2812.cpp>

[env:buttons_test]
build_src_filter = +<drivers/> +<tests/test_buttons.cpp>

[env:buzzer_test]
build_src_filter = +<drivers/> +<tests/test_buzzer.cpp>

[env:power_test]
build_src_filter = +<drivers/> +<tests/test_power.cpp>

[env:max17048_test]
lib_deps = adafruit/Adafruit MAX1704X@^1.0.3
build_src_filter = +<drivers/> +<tests/test_max17048.cpp>

[env:oled_test]
lib_deps =
    adafruit/Adafruit SH110X@^2.1.12
    adafruit/Adafruit GFX Library@^1.11.11
build_src_filter = +<drivers/> +<tests/test_oled.cpp>

; NOTE: Coded PHY relies on the patched global Bluefruit library
; (BLEConnection.cpp — see "BLE Long Range" in ../../DiscoX C++ BLE/CLAUDE.md).
; A platform/framework update reverts the patch silently.
[env:ble_test]
build_src_filter = +<drivers/> +<tests/test_ble.cpp>
