name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to publish a release on tag pushes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run native unit tests
        run: cd PCB_V2 && pio test -e native

      - name: Build PCB V2
        run: ./build.sh

      - name: Upload V2 UF2
        uses: actions/upload-artifact@v4
        with:
          name: v2-${{ github.run_number }}
          path: build/v2.uf2

      # Name the published asset after the tag. build.sh always writes
      # build/v2.uf2, but "v2.uf2" is a meaningless thing to find in a
      # Downloads folder six months later -- and the website tells people to
      # drop mrzappy-<version>.uf2 onto the DISCOX drive.
      - name: Name the release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: cp build/v2.uf2 "build/mrzappy-${{ github.ref_name }}.uf2"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/mrzappy-${{ github.ref_name }}.uf2
          generate_release_notes: true

      # The release body is what the website's changelog is built from, so it is
      # read here with the workflow's own token -- WEBSITE_PR_TOKEN below is
      # scoped to the website repo and cannot see this repo's releases.
      - name: Read the release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" \
             --repo "${{ github.repository }}" --json body -q .body \
             > "${RUNNER_TEMP}/release-notes.md"

      # Open a PR on discox.co.uk with the new .uf2, the version strings and the
      # changelog. Brendan merges it; merging that repo's main is the deploy.
      #
      # WEBSITE_PR_TOKEN is a fine-grained PAT scoped to
      # blhall195/DiscoX-Cave-Survey-Device ONLY, with Contents: write and
      # Pull requests: write. It deliberately cannot touch this repo. If it is
      # missing or expired the release still publishes -- the website just lags,
      # and `publish-firmware` in the website repo is the manual catch-up.
      - name: Open the website pull request
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_PR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::WEBSITE_PR_TOKEN is not set -- discox.co.uk was not updated."
            exit 0
          fi
          python3 tools/publish_to_website.py \
            --tag "${{ github.ref_name }}" \
            --uf2 "build/mrzappy-${{ github.ref_name }}.uf2" \
            --notes "${RUNNER_TEMP}/release-notes.md"
