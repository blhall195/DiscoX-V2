; Mr Zappy PCB V2 — production firmware (single nRF52840, Raytac MDBT50Q-U1MV2)
;
; Merged port of the V1 two-board system:
;   ../Main board C++/     (SAMD51: sensors, display, laser, survey logic)
;   ../DiscoX C++ BLE/     (nRF52840: SAP6 BLE bridge — now in-process)
; Hardware bring-up tests + decoded netlist live in "../PCB_V2 test/".
;
; Board def: nrf52840_dk_adafruit (pca10056 variant) — Arduino pin N maps 1:1
; to nRF GPIO (P0.xx = xx, P1.yy = 32+yy), which include/pins_v2.h relies on.
; Do NOT switch to an ItsyBitsy-based variant (its Wire pins collide with the
; SCA3300 SPI pins on this PCB).
;
; Flashing: Adafruit UF2/DFU bootloader is on the module (burned via SWD H2).
;   pio run -e pcb_v2 -t upload     # USB DFU, port auto-detected (VID 239A)
; Close any serial monitor first or upload fails with PermissionError.
;
; NOTE (BLE long range): Coded PHY relies on the patched global Bluefruit
; library (BLEConnection.cpp — see "BLE Long Range" in
; "../DiscoX C++ BLE/CLAUDE.md"). Platform/framework updates revert it silently.

[platformio]
default_envs = pcb_v2

[env:pcb_v2]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
; DK profile doesn't 1200bps-touch (real DK uses J-Link) — needed so a running
; app resets into the bootloader for USB re-flash
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
build_flags =
    -Os
lib_deps =
    hideakitai/ArduinoEigen@^0.3.0
    bblanchon/ArduinoJson@^7.3.0
    adafruit/Adafruit SH110X@^2.1.12
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit MAX1704X@^1.0.3
    adafruit/Adafruit BusIO@^1.16.2

; Host-side unit tests (Unity) — carried over from the V1 main board project
[env:native]
platform = native
test_framework = unity
build_flags = -I test/support -I include
build_src_filter = -<*> +<shot_vector.cpp> +<leg_checker.cpp> +<button_manager.cpp>
test_build_src = yes
